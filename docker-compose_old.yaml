volumes:
  n8n_oss_storage:
  postgres_oss_storage:

networks:
  oss_demo:

services:
  postgres-oss:
    image: postgres:16-alpine
    networks: ["oss_demo"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - postgres_oss_storage:/var/lib/postgresql/data

  n8n-oss:
    image: n8nio/n8n:latest
    networks: ["oss_demo"]
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-oss
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_ENCRYPTION_KEY: a_secure_encryption_key
      WEBHOOK_URL: https://meet-fairly-lioness.ngrok-free.app
      N8N_EDITOR_BASE_URL: https://meet-fairly-lioness.ngrok-free.app
      N8N_PROXY_HOPS: 1
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: my-sandbox-api-key
    volumes:
      - n8n_oss_storage:/home/node/.n8n
